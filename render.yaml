services:
  - type: web
    name: ai-4d-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: sh -c "uvicorn api.main:app --host 0.0.0.0 --port ${PORT:-10000}"
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: "10000"
