name: AI 4D API CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -q

      - name: Validate Alembic migrations
        env:
          PYTHONPATH: .
          DATABASE_URL: sqlite:///./ci-ai4d.db
        run: alembic upgrade head

      - name: Build Docker image
        run: docker build -t ai-4d-api .
